<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <desc>квадрат, чёрный контур, чёрная штриховка</desc>
  <defs>
    <pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="14" stroke="black" stroke-width="4" />
    </pattern>
  </defs>
  <rect x="10" y="10" width="380" height="380" fill="url(#hatch)" stroke="black" stroke-width="6" />
</svg>
